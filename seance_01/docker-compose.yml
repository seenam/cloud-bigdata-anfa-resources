services:
  minio:
    image: minio/minio:latest        # image Docker à utiliser
    container_name: anfa-minio       # nom du conteneur
    ports:
      - "9000:9000"                  # API S3
      - "9001:9001"                  # console web
    environment:
      MINIO_ROOT_USER: anfa-admin          # utilisateur root
      MINIO_ROOT_PASSWORD: anfa-password-2026  # mot de passe root
    volumes:
      - anfa-minio-data:/data        # volume pour persister les données
    command: server /data --console-address ":9001"

volumes:
  anfa-minio-data:
    external: true                   # volume déjà créé manuellement
    name: anfa-minio-data